name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: harsh07-builds
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FF1E27&color_dots=#1a1a1a,#4a0a0e,#7a0a10,#b3121b,#FF1E27
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FF1E27

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
