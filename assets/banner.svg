<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="HARSH — Spring Boot, RAG, Data Structures and Algorithms" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070b"/>
      <stop offset="1" stop-color="#0d050a"/>
    </linearGradient>

    <radialGradient id="warm" cx="0.22" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#a3122f" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#a3122f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a0f25" stop-opacity="0"/>
      <stop offset="1" stop-color="#7a0f25" stop-opacity="0.28"/>
    </linearGradient>

    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d1244a"/>
      <stop offset="1" stop-color="#6e0e24"/>
    </linearGradient>

    <linearGradient id="divider" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2163b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d1244a" stop-opacity="1"/>
      <stop offset="1" stop-color="#c2163b" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#c2163b" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <filter id="softGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <style>
    .mono  { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace; }
    .title { font-family: 'Arial Black','Segoe UI Black',Impact,'Helvetica Neue',Arial,sans-serif; font-weight: 900; }

    @keyframes breathe { 0%,100% { opacity: .30; } 50% { opacity: .55; } }
    .breathe { animation: breathe 5s ease-in-out infinite; }

    @keyframes rowIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: translateX(0); } }
    .r1 { animation: rowIn .9s ease-out .15s both; }
    .r2 { animation: rowIn .9s ease-out .35s both; }
    .r3 { animation: rowIn .9s ease-out .55s both; }
    .r4 { animation: rowIn .9s ease-out .75s both; }

    @keyframes barIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .bar { transform-box: fill-box; transform-origin: left center; animation: barIn 1s ease-out .1s both; }
  </style>

  <!-- Background -->
  <rect width="1000" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="300" rx="16" fill="url(#warm)"/>
  <rect width="1000" height="300" rx="16" fill="url(#grid)"/>

  <!-- Right panel -->
  <polygon points="668,0 984,0 1000,16 1000,284 984,300 628,300" fill="url(#panel)"/>

  <!-- Slim diagonal divider -->
  <line x1="672" y1="22" x2="632" y2="278" stroke="url(#divider)" stroke-width="3"/>
  <line x1="686" y1="22" x2="646" y2="278" stroke="url(#divider)" stroke-width="1" opacity="0.5"/>

  <!-- Outer frame -->
  <rect x="3" y="3" width="994" height="294" rx="14" fill="none" stroke="#8f1230" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Name -->
  <text class="title breathe" x="58" y="150" font-size="100" letter-spacing="8" fill="#c2163b" filter="url(#softGlow)">HARSH</text>
  <text class="title" x="58" y="150" font-size="100" letter-spacing="8" fill="#ffffff">HARSH</text>

  <!-- Accent bar -->
  <rect class="bar" x="62" y="174" width="120" height="4" rx="2" fill="url(#bar)"/>

  <!-- Tagline -->
  <text class="mono" x="62" y="214" font-size="15" font-weight="700" fill="#d1334f"
        textLength="530" lengthAdjust="spacing">SPRING BOOT  •  RAG  •  DATA STRUCTURES &amp; ALGORITHMS</text>

  <!-- Right-side list -->
  <g class="mono" font-size="17" font-weight="600">
    <g class="r1">
      <rect x="706" y="76" width="7" height="7" fill="#c2163b"/>
      <text x="728" y="86" fill="#d8cdd0">Spring Boot</text>
      <line x1="706" y1="104" x2="940" y2="104" stroke="#8f1230" stroke-opacity="0.35"/>
    </g>
    <g class="r2">
      <rect x="696" y="118" width="7" height="7" fill="#c2163b"/>
      <text x="718" y="128" fill="#d8cdd0">RAG + LangChain</text>
      <line x1="696" y1="146" x2="930" y2="146" stroke="#8f1230" stroke-opacity="0.35"/>
    </g>
    <g class="r3">
      <rect x="686" y="160" width="7" height="7" fill="#c2163b"/>
      <text x="708" y="170" fill="#d8cdd0">AWS Serverless</text>
      <line x1="686" y1="188" x2="920" y2="188" stroke="#8f1230" stroke-opacity="0.35"/>
    </g>
    <g class="r4">
      <rect x="676" y="202" width="7" height="7" fill="#e0345a"/>
      <text x="698" y="212" fill="#ffffff">250+ LeetCode</text>
    </g>
  </g>
</svg>
