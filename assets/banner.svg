<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Harsh">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050506"/>
      <stop offset="1" stop-color="#14070A"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF1E27" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#7A0A10" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FF1E27" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <polygon points="820,0 1200,0 1200,300 700,300" fill="url(#slash)" opacity="0.18"/>
  <polygon points="900,0 930,0 830,300 800,300" fill="#FF1E27" opacity="0.85"/>
  <rect x="0" y="0" width="1200" height="3" fill="#FF1E27"/>
  <rect x="0" y="297" width="1200" height="3" fill="#FF1E27"/>

  <text x="70" y="82" font-family="'Fira Code','Courier New',monospace" font-size="20" fill="#FF1E27" fill-opacity="0.9">harsh@workstation:~$ whoami</text>
  <text x="66" y="188" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="108" font-weight="800" fill="#FFFFFF" filter="url(#glow)" letter-spacing="2">HARSH</text>
  <rect x="70" y="208" width="140" height="5" fill="#FF1E27"/>
  <text x="70" y="250" font-family="'Fira Code','Courier New',monospace" font-size="22" fill="#E6E6E6">Full-Stack  /  Cloud Systems  /  Low-Latency APIs  /  AI-ML</text>

  <g font-family="'Fira Code','Courier New',monospace" font-size="16" fill="#FF1E27" fill-opacity="0.75">
    <text x="960" y="120">Spring Boot</text>
    <text x="960" y="150">RAG + LangChain</text>
    <text x="960" y="180">AWS Serverless</text>
    <text x="960" y="210">200+ LeetCode</text>
  </g>
  <rect x="1130" y="104" width="10" height="20" fill="#FF1E27">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
